<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordem & Caos — A Metamorfose</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f2ec; --paper: #fdfaf4; --ink: #2a1f0e; --muted: #8A8070; --line: #d8cfbf;
    --ordem: #2E5C14; --ordem-dark: #1A3A08; --ordem-soft: #DFF0D0;
    --caos: #7A3800; --caos-dark: #4A2000; --caos-soft: #FAF0E0;
    --gold: #8A6000; --danger: #a3261b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'IM Fell English', Georgia, serif; font-size: 18px; line-height: 1.4; }
  h1, h2, h3, .sc { font-family: 'IM Fell English SC', serif; font-weight: normal; margin: 0; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
  button { font-family: 'IM Fell English SC', serif; font-size: 18px; border: 0; border-radius: 6px; padding: 12px 20px; cursor: pointer; background: var(--ink); color: #fff; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.ordem { background: var(--ordem); } button.caos { background: var(--caos); }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button.big { font-size: 24px; padding: 16px 32px; }
  input { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; width: 100%; background: #fff; }
  label { display: block; margin: 12px 0 4px; color: var(--muted); font-size: 15px; }

  /* entrada */
  .join { max-width: 520px; margin: 40px auto; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 28px; }
  .join h1 { font-size: 34px; text-align: center; }
  .join .sub { text-align: center; color: var(--muted); margin-bottom: 12px; font-style: italic; }
  .roles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .roles button { background: #fff; color: var(--ink); border: 2px solid var(--line); }
  .roles button.sel.ordem { background: var(--ordem); color: #fff; border-color: var(--ordem); }
  .roles button.sel.caos { background: var(--caos); color: #fff; border-color: var(--caos); }
  .roles button.sel.juiz, .roles button.sel.plateia { background: var(--ink); color: #fff; border-color: var(--ink); }
  .err { color: var(--danger); margin-top: 10px; min-height: 1.2em; }

  /* placar */
  .top { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; margin-bottom: 16px; }
  .team { padding: 12px 16px; border-radius: 8px; color: #fff; }
  .team.ordem { background: var(--ordem); } .team.caos { background: var(--caos); text-align: right; }
  .team .lbl { font-size: 13px; opacity: .8; letter-spacing: .05em; }
  .team .nm { font-family: 'IM Fell English SC', serif; font-size: 24px; }
  .team .pts { font-size: 40px; font-family: 'IM Fell English SC', serif; line-height: 1; }
  .team .deck { font-size: 13px; opacity: .8; }
  .team.on { outline: 4px solid var(--gold); outline-offset: 2px; }
  .mid { text-align: center; min-width: 140px; }
  .mid .rd { font-size: 14px; color: var(--muted); }
  .mid .emp { font-size: 14px; color: var(--muted); }

  /* fase + timer */
  .stage { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; text-align: center; margin-bottom: 16px; }
  .stage .ph { font-family: 'IM Fell English SC', serif; font-size: 26px; }
  .stage .hint { color: var(--muted); font-style: italic; }
  .timer { font-family: 'IM Fell English SC', serif; font-size: 72px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .timer.low { color: var(--danger); }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 8px auto 0; max-width: 500px; }
  .bar > i { display: block; height: 100%; background: var(--ink); transition: width .25s linear; }
  .actions { margin-top: 14px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  /* cartas */
  .board { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .slot { min-height: 280px; border: 2px dashed var(--line); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--muted); font-style: italic; padding: 12px; text-align: center; }
  .card { border-radius: 12px; padding: 18px; color: var(--ink); background: #fff; border: 3px solid; position: relative; }
  .card.new { animation: flip .5s ease; }
  .card.ordem { border-color: var(--ordem); background: linear-gradient(#fff, var(--ordem-soft)); }
  .card.caos { border-color: var(--caos); background: linear-gradient(#fff, var(--caos-soft)); }
  .card.especial { border-style: dashed; }
  .card .hd { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .card .nome { font-family: 'IM Fell English SC', serif; font-size: 26px; line-height: 1.1; }
  .card .tipo { font-size: 13px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; margin-top: 4px; }
  .card .val { font-family: 'IM Fell English SC', serif; font-size: 40px; line-height: 1; white-space: nowrap; }
  .card.ordem .val { color: var(--ordem); } .card.caos .val { color: var(--caos); }
  .card .ef { margin: 14px 0 10px; padding: 10px; background: rgba(255,255,255,.7); border-radius: 6px; }
  .card .nar-l { font-size: 12px; letter-spacing: .1em; color: var(--muted); }
  .card .nar { font-style: italic; }
  .card .star { color: var(--gold); }
  @keyframes flip { from { transform: rotateY(90deg); opacity: 0; } to { transform: none; opacity: 1; } }

  /* juiz / resultado */
  .votes { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .votes button.sel { outline: 4px solid var(--gold); outline-offset: 2px; }
  .result { font-family: 'IM Fell English SC', serif; font-size: 34px; }
  .result.ordem { color: var(--ordem); } .result.caos { color: var(--caos); }

  .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; margin-bottom: 16px; }
  .panel h3 { font-size: 20px; margin-bottom: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 16px; }
  td, th { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; }
  .w-ordem { color: var(--ordem); font-weight: bold; } .w-caos { color: var(--caos); font-weight: bold; }
  .foot { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 14px; gap: 10px; flex-wrap: wrap; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--danger); color: #fff; padding: 10px 18px; border-radius: 6px; display: none; z-index: 10; }
  .conn { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #3a9a3a; margin-right: 6px; }
  .conn.off { background: var(--danger); }

  @media (max-width: 700px) {
    .board { grid-template-columns: 1fr; }
    .top { grid-template-columns: 1fr 1fr; }
    .mid { grid-column: 1 / -1; order: -1; }
    .timer { font-size: 56px; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
const $app = document.getElementById('app');
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ROLE_LABEL = { ordem: 'Ordem', caos: 'Caos', juiz: 'Juiz(a)', plateia: 'Plateia' };

let session = null; // { room, token }
let S = null;       // estado do servidor
let offset = 0;     // relógio servidor - cliente
let es = null;
let lastPhaseKey = '';

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.h); toast.h = setTimeout(() => (t.style.display = 'none'), 3500);
}

async function post(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Erro');
  return j;
}

async function action(name, extra = {}) {
  try { await post('/api/action', { room: session.room, token: session.token, action: name, ...extra }); }
  catch (e) { toast(e.message); }
}

function beep(freq = 660, ms = 180) {
  try {
    const ctx = beep.ctx || (beep.ctx = new (window.AudioContext || window.webkitAudioContext)());
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = freq; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.15, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + ms / 1000);
    o.start(); o.stop(ctx.currentTime + ms / 1000);
  } catch {}
}

// ---------- tela de entrada ----------
let joinRole = null;
let draft = {};

async function renderJoin(err = '') {
  const params = new URLSearchParams(location.search);
  const room = draft.room || params.get('sala') || LS.get('oc_room') || 'SALA1';
  $app.innerHTML = `
    <div class="join">
      <h1>Ordem &amp; Caos</h1>
      <div class="sub">RPG Literário · A Metamorfose · Franz Kafka</div>
      <label>Código da sala</label>
      <input id="room" value="${esc(room)}" maxlength="20">
      <label>Seu nome</label>
      <input id="name" value="${esc(draft.name ?? LS.get('oc_name') ?? '')}" maxlength="40" placeholder="Ex.: Maria">
      <label>Entrar como</label>
      <div class="roles">
        ${['ordem', 'caos', 'juiz', 'plateia'].map((r) => `<button type="button" data-role="${r}" class="${r} ${joinRole === r ? 'sel' : ''}">${r === 'ordem' ? 'Time da Ordem' : r === 'caos' ? 'Time do Caos' : ROLE_LABEL[r]}</button>`).join('')}
      </div>
      <div id="teamBox"></div>
      <div style="margin-top:18px"><button id="go" class="big" style="width:100%">Entrar</button></div>
      <div class="err" id="err">${esc(err)}</div>
    </div>`;
  document.querySelectorAll('.roles button').forEach((b) => (b.onclick = () => {
    joinRole = b.dataset.role;
    draft = { room: document.getElementById('room').value, name: document.getElementById('name').value };
    renderJoin(err);
  }));
  document.getElementById('go').onclick = doJoin;
  document.getElementById('name').onkeydown = (e) => { if (e.key === 'Enter') doJoin(); };

  if (joinRole === 'ordem' || joinRole === 'caos') {
    const box = document.getElementById('teamBox');
    try {
      const teams = await (await fetch('/api/teams?room=' + encodeURIComponent(document.getElementById('room').value))).json();
      const existing = teams[joinRole]?.name;
      box.innerHTML = existing
        ? `<label>Nome do time</label><div class="sc" style="font-size:22px">${esc(existing)}</div><div style="color:var(--muted);font-size:14px">Time já criado — você entra nele.</div>`
        : `<label>Nome do time</label><input id="teamName" maxlength="40" placeholder="Ex.: Os Samsa">`;
    } catch { box.innerHTML = `<label>Nome do time</label><input id="teamName" maxlength="40">`; }
  }
}

async function doJoin() {
  const room = document.getElementById('room').value.trim();
  const name = document.getElementById('name').value.trim();
  const teamName = document.getElementById('teamName')?.value.trim();
  if (!joinRole) return (document.getElementById('err').textContent = 'Escolha um papel.');
  try {
    const r = await post('/api/join', { room, name, role: joinRole, teamName, token: LS.get('oc_token') });
    LS.set('oc_token', r.token); LS.set('oc_room', r.room); LS.set('oc_name', name);
    session = { room: r.room, token: r.token };
    connect();
  } catch (e) { document.getElementById('err').textContent = e.message; }
}

function leave() {
  if (es) es.close();
  LS.del('oc_room'); session = null; S = null;
  renderJoin();
}

// ---------- conexão ----------
function connect() {
  if (es) es.close();
  es = new EventSource(`/events?room=${encodeURIComponent(session.room)}&token=${encodeURIComponent(session.token)}`);
  es.onmessage = (e) => {
    S = JSON.parse(e.data);
    offset = S.now - Date.now();
    const key = S.phase + S.round + S.active;
    if (lastPhaseKey && key !== lastPhaseKey) beep(S.phase === 'result' ? 880 : 660);
    lastPhaseKey = key;
    render();
  };
  es.onopen = () => document.querySelector('.conn')?.classList.remove('off');
  es.onerror = () => {
    document.querySelector('.conn')?.classList.add('off');
    // 404 = a sala não existe mais (servidor reiniciou): volta à entrada
    if (es.readyState === EventSource.CLOSED) renderJoin('Conexão perdida ou sala reiniciada. Entre novamente.');
  };
}

// ---------- jogo ----------
const PHASE = {
  lobby: 'Aguardando jogadores',
  draw: 'Puxar carta',
  think: 'Tempo para pensar',
  speak: 'Argumentação',
  judging: 'Juízes decidem',
  result: 'Resultado da rodada',
  finished: 'Fim de jogo',
};

function teamName(t) { return S.teams[t].name || (t === 'ordem' ? 'Ordem' : 'Caos'); }

const seenCards = new Set();
function cardHtml(c, team) {
  if (!c) return '';
  const key = S.round + team + c.id;
  const isNew = !seenCards.has(key);
  seenCards.add(key);
  return `<div class="card ${team} ${c.especial ? 'especial' : ''} ${isNew ? 'new' : ''}">
    <div class="hd">
      <div><div class="nome">${c.especial ? '<span class="star">★</span> ' : ''}${esc(c.nome)}</div>
      <div class="tipo">${esc(c.tipo)} · ${team === 'ordem' ? 'Ordem' : 'Caos'}</div></div>
      <div class="val">${esc(c.valor)}</div>
    </div>
    <div class="ef">${esc(c.efeito)}</div>
    <div class="nar-l">NARRAÇÃO SUGERIDA</div>
    <div class="nar">“${esc(c.narracao)}”</div>
  </div>`;
}

function slotHtml(team) {
  const c = S.current[team];
  if (c) return cardHtml(c, team);
  const waiting = S.phase !== 'lobby' && S.phase !== 'finished';
  return `<div class="slot">${waiting ? `${esc(teamName(team))} ainda não puxou a carta` : 'Carta'}</div>`;
}

function stageHtml() {
  const me = S.me || {};
  const isJudge = me.role === 'juiz';
  const act = S.active;
  const mine = me.role === act;
  let hint = '', buttons = '';

  switch (S.phase) {
    case 'lobby': {
      const ready = S.teams.ordem.name && S.teams.caos.name;
      hint = `Ordem: ${S.roster.ordem.length ? esc(S.roster.ordem.join(', ')) : '—'} · Caos: ${S.roster.caos.length ? esc(S.roster.caos.join(', ')) : '—'} · Juízes: ${S.roster.juiz.length ? esc(S.roster.juiz.join(', ')) : '—'}`;
      if (isJudge) buttons = `<button class="big" data-a="start" ${ready ? '' : 'disabled'}>Iniciar partida</button>`;
      else hint += '<br>Um(a) juiz(a) inicia a partida quando os dois times estiverem na sala.';
      break;
    }
    case 'draw':
      hint = `Vez de <b>${esc(teamName(act))}</b> puxar uma carta.`;
      if (mine) buttons = `<button class="big ${act}" data-a="draw">Puxar carta (${S.deckLeft[act]} no deck)</button>`;
      break;
    case 'think':
      hint = `<b>${esc(teamName(act))}</b> está preparando o argumento.`;
      if (mine) buttons = `<button class="${act}" data-a="skip">Pronto — começar a argumentar</button>`;
      break;
    case 'speak':
      hint = `<b>${esc(teamName(act))}</b> está argumentando.`;
      if (mine) buttons = `<button class="${act}" data-a="skip">Terminamos</button>`;
      break;
    case 'judging':
      hint = `Quem venceu o argumento? · Votos: ${S.votesIn}/${S.judgeCount}`;
      if (isJudge) {
        const v = S.myVote;
        buttons = `<div class="votes">
          <button class="ordem big ${v === 'ordem' ? 'sel' : ''}" data-a="vote" data-c="ordem">${esc(teamName('ordem'))}</button>
          <button class="big ghost ${v === 'empate' ? 'sel' : ''}" data-a="vote" data-c="empate">Empate</button>
          <button class="caos big ${v === 'caos' ? 'sel' : ''}" data-a="vote" data-c="caos">${esc(teamName('caos'))}</button>
        </div>
        <div class="actions"><button class="ghost" data-a="close">Encerrar votação agora</button></div>`;
      }
      break;
    case 'result': {
      const r = S.lastResult;
      const w = r.winner;
      hint = `<div class="result ${w}">${w === 'empate' ? 'Empate!' : esc(teamName(w)) + ' venceu a rodada!'}</div>
        Votos — ${esc(teamName('ordem'))}: ${r.tally.ordem} · ${esc(teamName('caos'))}: ${r.tally.caos} · Empate: ${r.tally.empate}`;
      if (isJudge) {
        const last = S.deckLeft.ordem === 0 || S.deckLeft.caos === 0;
        buttons = `<button class="big" data-a="next">${last ? 'Ver resultado final' : 'Próxima rodada'}</button>`;
      }
      break;
    }
    case 'finished': {
      const { ordem, caos } = S.score;
      const w = ordem > caos ? 'ordem' : caos > ordem ? 'caos' : null;
      hint = `<div class="result ${w || ''}">${w ? esc(teamName(w)) + ' venceu a partida!' : 'A partida terminou empatada!'}</div>
        ${ordem} × ${caos} (${S.score.empate} empate${S.score.empate === 1 ? '' : 's'})`;
      if (isJudge) buttons = `<button data-a="reset">Nova partida</button>`;
      break;
    }
  }

  const timed = !!S.endsAt;
  return `<div class="stage">
    <div class="ph">${PHASE[S.phase]}${act && ['draw', 'think', 'speak'].includes(S.phase) ? ' · ' + esc(teamName(act)) : ''}</div>
    ${timed ? `<div class="timer" id="timer">--:--</div><div class="bar"><i id="bar"></i></div>` : ''}
    <div class="hint" style="margin-top:8px">${hint}</div>
    ${buttons ? `<div class="actions">${buttons}</div>` : ''}
  </div>`;
}

function render() {
  if (!S) return;
  const me = S.me || {};
  const on = (t) => (S.active === t && ['draw', 'think', 'speak'].includes(S.phase) ? 'on' : '');
  const hist = S.history.slice().reverse().map((h) => `<tr>
      <td>${h.round}</td><td>${esc(h.ordem || '—')}</td><td>${esc(h.caos || '—')}</td>
      <td class="w-${h.winner}">${h.winner === 'empate' ? 'Empate' : esc(teamName(h.winner))}</td></tr>`).join('');

  $app.innerHTML = `
    <div class="top">
      <div class="team ordem ${on('ordem')}">
        <div class="lbl">ORDEM · A FAMÍLIA</div>
        <div class="nm">${esc(teamName('ordem'))}</div>
        <div class="pts">${S.score.ordem}</div>
        <div class="deck">${S.deckLeft.ordem} cartas no deck</div>
      </div>
      <div class="mid">
        <div class="sc" style="font-size:22px">Rodada ${S.round || '—'}</div>
        <div class="rd">de ${S.totalRounds}</div>
        <div class="emp">Empates: ${S.score.empate}</div>
      </div>
      <div class="team caos ${on('caos')}">
        <div class="lbl">CAOS · A METAMORFOSE</div>
        <div class="nm">${esc(teamName('caos'))}</div>
        <div class="pts">${S.score.caos}</div>
        <div class="deck">${S.deckLeft.caos} cartas no deck</div>
      </div>
    </div>
    ${stageHtml()}
    ${S.phase === 'lobby' ? '' : `<div class="board">
      <div>${slotHtml(S.order[0])}</div>
      <div>${slotHtml(S.order[1])}</div>
    </div>`}
    ${hist ? `<div class="panel"><h3>Histórico</h3><table>
      <tr><th>#</th><th>${esc(teamName('ordem'))}</th><th>${esc(teamName('caos'))}</th><th>Vencedor</th></tr>${hist}</table></div>` : ''}
    <div class="foot">
      <span><span class="conn"></span>Sala <b>${esc(S.code)}</b> · você: ${esc(me.name)} (${ROLE_LABEL[me.role] || '—'})</span>
      <span>
        ${me.role === 'juiz' && !['lobby', 'finished'].includes(S.phase) ? '<button class="ghost" data-a="end" style="font-size:14px;padding:6px 10px">Encerrar partida</button>' : ''}
        <button class="ghost" id="leave" style="font-size:14px;padding:6px 10px">Sair</button>
      </span>
    </div>`;

  $app.querySelectorAll('[data-a]').forEach((b) => (b.onclick = () => {
    const a = b.dataset.a;
    if ((a === 'end' || a === 'reset') && !confirm(a === 'end' ? 'Encerrar a partida agora?' : 'Começar uma nova partida? O placar será zerado.')) return;
    action(a, b.dataset.c ? { choice: b.dataset.c } : {});
  }));
  document.getElementById('leave').onclick = leave;
  tick();
}

function tick() {
  const el = document.getElementById('timer');
  if (!el || !S || !S.endsAt) return;
  const left = Math.max(0, S.endsAt - (Date.now() + offset));
  const s = Math.ceil(left / 1000);
  el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  el.classList.toggle('low', s <= 10);
  const total = S.durations[S.phase] || 1;
  document.getElementById('bar').style.width = `${(left / total) * 100}%`;
}
setInterval(tick, 250);

// ---------- início ----------
(function init() {
  const room = new URLSearchParams(location.search).get('sala') || LS.get('oc_room');
  const token = LS.get('oc_token');
  if (room && token && LS.get('oc_name')) {
    session = { room: room.toUpperCase().replace(/[^A-Z0-9]/g, ''), token };
    // confirma que ainda estamos na sala (o servidor pode ter reiniciado)
    fetch(`/events?room=${encodeURIComponent(session.room)}&token=${encodeURIComponent(token)}`, { method: 'HEAD' })
      .then((r) => (r.ok ? connect() : renderJoin()))
      .catch(() => renderJoin());
  } else renderJoin();
})();
</script>
</body>
</html>
